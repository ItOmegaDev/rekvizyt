services:
  app:
    build: .
    container_name: rekvizyt
    restart: unless-stopped
    ports:
      - '127.0.0.1:4002:4000'
    env_file:
      - .env
    environment:
      - DATA_DIR=/data
      - SERVE_CLIENT=1
    volumes:
      - rekvizyt_data:/data
    networks:
      - web

volumes:
  rekvizyt_data:

networks:
  web:
    external: true
    name: web
